[workspace]
resolver = "2"
members = [
    "crates/dock-core",
    "crates/dock-render",
    "crates/dock-wayland",
    "crates/dock-daemon",
    "crates/dock-settings",
]

[workspace.package]
version = "0.5.0"
edition = "2021"

[workspace.dependencies]
# Wayland y protocolos de KDE Plasma
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
calloop = "0.14"
calloop-wayland-source = "0.4"

# Renderizado GPU e iconos
wgpu = "23"
raw-window-handle = "0.6"
pollster = "0.4"
bytemuck = { version = "1.21", features = ["derive"] }
resvg = "0.45"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Sistema, D-Bus y utilidades
tokio = { version = "1", features = ["rt", "sync", "macros"] }
zbus = "5"
futures-util = "0.3"
freedesktop-icons = "0.4"
dirs = "5"
notify = "7"
cosmic-text = "0.12"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
