name: Build & Attach RPM Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-rpm:
    name: Build Fedora RPM
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:45

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rpm-build rpmdevtools cargo rust gcc pkgconf-pkg-config \
            wayland-devel libxkbcommon-devel fontconfig-devel \
            mesa-libGL-devel libX11-devel libXcursor-devel \
            libXi-devel libXrandr-devel gh git

      - name: Build binary and RPM package
        run: |
          cargo build --release --workspace
          rpmdev-setuptree
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p rpmbuild-src/neonpear-dock-${VERSION}
          cp -a Cargo.toml Cargo.lock crates packaging assets rpmbuild-src/neonpear-dock-${VERSION}/
          tar -cJf ~/rpmbuild/SOURCES/neonpear-dock-${VERSION}.tar.xz -C rpmbuild-src neonpear-dock-${VERSION}
          mkdir -p ~/rpmbuild/BUILD/neonpear-dock-${VERSION}/target/release
          cp target/release/neonpear-dock target/release/neonpear-dock-settings \
             ~/rpmbuild/BUILD/neonpear-dock-${VERSION}/target/release/
          rpmbuild -bb --noclean packaging/neonpear-dock.spec

      - name: Upload RPM artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" ~/rpmbuild/RPMS/*/*.rpm --clobber
