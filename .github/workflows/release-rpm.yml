name: Build and Release RPM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y rpm-build rpmdevtools dnf-plugins-core tar xz git
          dnf builddep -y packaging/neonpear-dock.spec

      - name: Prepare sources and vendored crates
        run: |
          VERSION=$(grep -m1 '^Version:' packaging/neonpear-dock.spec | awk '{print $2}')
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          rpmdev-setuptree
          mkdir -p "rpmbuild-src/neonpear-dock-${VERSION}"
          cp -a Cargo.toml Cargo.lock crates packaging assets "rpmbuild-src/neonpear-dock-${VERSION}/"
          tar -czf "$HOME/rpmbuild/SOURCES/neonpear-dock-${VERSION}.tar.gz" \
            -C rpmbuild-src "neonpear-dock-${VERSION}"

          cargo vendor vendor
          tar -cJf "$HOME/rpmbuild/SOURCES/neonpear-dock-${VERSION}-vendor.tar.xz" vendor

      - name: Build RPM
        run: |
          rpmbuild -bb packaging/neonpear-dock.spec
          mkdir -p dist
          cp "$HOME"/rpmbuild/RPMS/*/*.rpm dist/

      - name: Upload RPM to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rpm
